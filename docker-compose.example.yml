services:
  n8n:
    build: .
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=YOUR_DOMAIN
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://YOUR_DOMAIN/
      - GENERIC_TIMEZONE=Africa/Cairo
      - TZ=Africa/Cairo
      - TELEGRAM_BOT_TOKEN=PUT_YOUR_BOT_TOKEN_HERE
      - NODES_EXCLUDE=[]
      - OPENAI_API_KEY=PUT_YOUR_OPENAI_KEY_HERE
      - OPENAI_MODEL=gpt-5.6-luna
      - TRANSCRIBE_MODEL=whisper-1
      - AUDIO_CHUNK_SECONDS=720
      - YT_SHORTS_ROOT=/data/yt_shorts/jobs
      - MAX_SHORTS_PER_JOB=8
      - ALLOWED_TELEGRAM_CHAT_IDS=PUT_YOUR_CHAT_ID_HERE
      - KEEP_JOB_FILES=1
      # n8n 2.x disables Execute Command by default. Configure your instance so
      # n8n-nodes-base.executeCommand is allowed before activating this workflow.
    volumes:
      - n8n_data:/home/node/.n8n
      - shorts_data:/data/yt_shorts/jobs

volumes:
  n8n_data:
  shorts_data:
